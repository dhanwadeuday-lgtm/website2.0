<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SNICKYLINK — Some things need two.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* SNICKYLINK — Site styles
   Palette anchor:
   --wine     #6B2B3C   --wine-dark #3A1620   --wine-ink #1E0E13
   --peach    #E8B99C   --blush     #FBF4F1   --copper   #B8654A
   --ink      #1F1B18
*/

:root {
  --wine: #6B2B3C;
  --wine-2: #7A3548;
  --wine-dark: #3A1620;
  --wine-ink: #1E0E13;
  --peach: #E8B99C;
  --peach-soft: #F2D5BE;
  --blush: #FBF4F1;
  --blush-2: #F5EAE3;
  --copper: #B8654A;
  --ink: #1F1B18;
  --ink-mute: #6a5f5b;
  --line: rgba(107,43,60,0.14);
  --line-strong: rgba(107,43,60,0.30);
  --line-peach: rgba(232,185,156,0.55);

  --serif: 'Playfair Display', 'Times New Roman', serif;
  --sans: 'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

  --content-max: 1200px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--blush);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
body { min-height: 100vh; }

::selection { background: var(--peach); color: var(--wine-ink); }

/* ----------- Grain overlay ----------- */
.grain {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 999;
  mix-blend-mode: multiply;
  opacity: 0.10;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.06  0 0 0 0 0.08  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.9'/></svg>");
  background-size: 240px 240px;
}

/* ----------- Type utilities ----------- */
.serif { font-family: var(--serif); }
.mono  { font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
.eyebrow {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--wine);
}
.italic { font-style: italic; }

/* Kill list styles for the ecosystem, etc. */
ul, li { list-style: none; margin: 0; padding: 0; }

/* ----------- Top bar ----------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 60;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px;
  pointer-events: none;
  mix-blend-mode: multiply;
}
.topbar > * { pointer-events: auto; }
.topbar .mark {
  font-family: var(--serif);
  font-size: 18px; font-weight: 600;
  color: var(--wine-ink);
  letter-spacing: -0.01em;
  display: flex; align-items: center; gap: 10px;
}
.topbar .mark .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--wine);
  box-shadow: 0 0 0 3px rgba(107,43,60,0.10);
  animation: breathe 3.5s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { transform: scale(1); opacity: 1; }
  50%     { transform: scale(0.85); opacity: 0.7; }
}
.topbar nav {
  display: flex; gap: 26px;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--wine-ink);
}
.topbar nav a { color: inherit; text-decoration: none; opacity: 0.7; transition: opacity .2s; }
.topbar nav a:hover { opacity: 1; }
@media (max-width: 720px) { .topbar nav { display: none; } .topbar { padding: 14px 18px; }}

/* ----------- Layout ----------- */
main {
  position: relative;
  padding: 0;
}
section {
  position: relative;
  padding: 120px 40px;
  max-width: var(--content-max);
  margin: 0 auto;
}
@media (max-width: 720px) { section { padding: 84px 20px; } }

.section-inner { position: relative; z-index: 2; }

/* The thread lives fixed on the left, but the sections push content right of it */
.threaded { padding-left: 120px; }
@media (max-width: 900px) { .threaded { padding-left: 68px; } }
@media (max-width: 480px) { .threaded { padding-left: 44px; } }

/* ---------- Thread SVG ---------- */
.thread-svg {
  position: absolute;
  top: 0; left: 0;
  width: 200px; height: 100%;
  pointer-events: none;
  z-index: 1;
}
@media (max-width: 900px) { .thread-svg { width: 110px; } }
@media (max-width: 480px) { .thread-svg { width: 70px; } }

.thread-path {
  fill: none;
  stroke: var(--wine);
  stroke-width: 1.25;
  opacity: 0.55;
  stroke-linecap: round;
  stroke-dasharray: 6 6;
  transition: stroke .6s, opacity .6s, stroke-width .6s, stroke-dasharray .6s;
}
body.state-enrolled .thread-path { stroke-dasharray: 3 5; opacity: 0.7; }
body.state-unlocked .thread-path {
  stroke: var(--copper); opacity: 0.85;
  stroke-dasharray: 0; stroke-width: 1.5;
  filter: drop-shadow(0 0 8px rgba(232,185,156,0.55));
}

.thread-pulse {
  fill: none;
  stroke: var(--peach);
  stroke-width: 2.5;
  stroke-linecap: round;
  opacity: 0;
  transition: opacity .3s;
}
body.state-unlocked .thread-pulse { opacity: 0.9; }

/* Thread nodes */
.thread-node {
  fill: var(--blush);
  stroke: var(--wine);
  stroke-width: 1.25;
  transition: fill .4s, stroke .4s, transform .4s;
}
.thread-node.active { fill: var(--wine); }
.thread-node.unlocked { fill: var(--peach); stroke: var(--copper); }

/* ------------- HERO ------------- */
.hero {
  min-height: 100vh;
  padding-top: 120px;
  padding-bottom: 80px;
  display: flex; align-items: center;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 48px;
  align-items: center;
  width: 100%;
}
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; gap: 32px; }
}
.hero-eyebrow { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.hero-eyebrow .bar { width: 44px; height: 1px; background: var(--wine); opacity: 0.6; }
.hero-title {
  font-family: var(--serif);
  font-size: clamp(40px, 6vw, 84px);
  line-height: 1.02;
  letter-spacing: -0.025em;
  font-weight: 600;
  color: var(--wine-ink);
  margin: 0;
}
.hero-title .em { font-style: italic; color: var(--wine); }
.hero-title .whisper {
  display: inline-block;
  font-size: 0.42em; font-family: var(--mono);
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--copper); vertical-align: middle;
  margin-left: 12px;
}
.hero-sub {
  margin-top: 28px;
  max-width: 460px;
  font-size: 18px; line-height: 1.6;
  color: var(--ink-mute);
  font-weight: 400;
}
.hero-sub em { color: var(--wine); font-style: italic; }

.cta-row { margin-top: 40px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }

.btn {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.02em;
  padding: 16px 28px;
  border-radius: 999px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform .25s cubic-bezier(.2,.7,.2,1), background .25s, color .25s, border-color .25s, box-shadow .3s;
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none;
}
.btn:active { transform: translateY(1px); }
.btn .arrow { transition: transform .3s cubic-bezier(.2,.7,.2,1); }
.btn:hover .arrow { transform: translateX(6px); }
.btn-primary {
  background: var(--wine); color: var(--blush);
  box-shadow: 0 12px 28px -14px rgba(58,22,32,0.5);
}
.btn-primary:hover { background: var(--wine-dark); box-shadow: 0 18px 40px -14px rgba(58,22,32,0.55); }
.btn-ghost { background: transparent; color: var(--wine-ink); border-color: var(--line-strong); }
.btn-ghost:hover { border-color: var(--wine); color: var(--wine); }
.btn-mini {
  padding: 10px 16px; font-size: 12px;
  font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em;
}
.btn-peach { background: var(--peach); color: var(--wine-ink); }
.btn-peach:hover { background: var(--peach-soft); }

.btn-link {
  font-family: var(--serif); font-style: italic; font-size: 16px;
  color: var(--wine); background: transparent; border: none; cursor: pointer;
  border-bottom: 1px solid var(--wine); padding: 2px 0; text-decoration: none;
  display: inline-flex; gap: 6px; align-items: center;
}
.btn-link .arrow { transition: transform .3s; }
.btn-link:hover .arrow { transform: translateX(6px); }

/* ORB */
.orb-wrap {
  position: relative;
  width: 100%; aspect-ratio: 1/1;
  max-width: 520px; margin-left: auto;
}
.orb {
  position: absolute; inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle at 32% 30%, rgba(232,185,156,0.55), transparent 55%),
    radial-gradient(circle at 65% 70%, rgba(107,43,60,0.55), transparent 60%),
    radial-gradient(circle at center, var(--wine-dark), var(--wine-ink) 70%);
  box-shadow:
    inset 0 0 60px rgba(0,0,0,0.4),
    0 40px 100px -40px rgba(58,22,32,0.6),
    0 0 0 1px rgba(232,185,156,0.15);
  transform: translate3d(0,0,0) rotate(0deg);
  transition: transform .35s cubic-bezier(.2,.7,.2,1);
}
.orb::before {
  content: "";
  position: absolute; inset: 6%;
  border-radius: 50%;
  border: 1px dashed rgba(232,185,156,0.28);
  animation: spinSlow 60s linear infinite;
}
.orb::after {
  content: "";
  position: absolute; inset: 16%;
  border-radius: 50%;
  border: 1px solid rgba(232,185,156,0.18);
  animation: spinSlow 90s linear infinite reverse;
}
@keyframes spinSlow { to { transform: rotate(360deg); } }

.orb-halo {
  position: absolute; inset: -22%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,185,156,0.35) 0%, rgba(232,185,156,0) 62%);
  filter: blur(20px);
  z-index: -1;
  animation: haloPulse 5s ease-in-out infinite;
}
@keyframes haloPulse {
  0%,100% { opacity: 0.7; transform: scale(1); }
  50%     { opacity: 1;   transform: scale(1.06); }
}

.orb-face {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--peach);
  padding: 40px;
}
.orb-face .stamp { font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em; opacity: 0.75; }
.orb-face .num   { font-family: var(--serif); font-size: 96px; font-weight: 600; line-height: 1; margin: 8px 0 2px; color: var(--blush); }
.orb-face .lock  { font-family: var(--mono); font-size: 12px; letter-spacing: 0.3em; margin-top: 10px; color: var(--peach); }
.orb-face .whisper {
  margin-top: 30px; font-family: var(--serif); font-style: italic;
  color: rgba(251,244,241,0.72); font-size: 15px; letter-spacing: 0.02em;
  min-height: 22px;
}

.orb-key {
  position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
  width: 22px; height: 30px;
  background: var(--peach);
  clip-path: polygon(50% 0, 100% 20%, 100% 100%, 0 100%, 0 20%);
  opacity: 0.9;
}

/* corner state chip */
.state-chip {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase;
  background: rgba(255,255,255,0.4);
  color: var(--wine-ink);
  backdrop-filter: blur(6px);
}
.state-chip .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--wine); }
.state-chip.unlocked { border-color: var(--copper); background: rgba(232,185,156,0.2); }
.state-chip.unlocked .pip { background: var(--copper); }

/* ---------- Enrollment / Duo ---------- */
.duo-wrap {
  background: linear-gradient(180deg, transparent, rgba(232,185,156,0.10));
  padding: 100px 40px 120px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.duo {
  max-width: 980px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 24px;
}
@media (max-width: 720px) {
  .duo { grid-template-columns: 1fr; }
}
.node {
  position: relative;
  text-align: center;
}
.node .avatar {
  width: 132px; height: 132px; border-radius: 50%;
  margin: 0 auto 18px;
  background: rgba(107,43,60,0.06);
  border: 1.5px solid var(--line-strong);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 44px; color: var(--wine);
  transition: all .5s cubic-bezier(.2,.7,.2,1);
  position: relative;
}
.node.filled .avatar {
  background: var(--wine); color: var(--peach);
  border-color: var(--wine);
  box-shadow: 0 20px 40px -18px rgba(58,22,32,0.6), 0 0 0 6px rgba(107,43,60,0.06);
}
.node.filled.you .avatar::after,
.node.filled.them .avatar::after {
  content: ""; position: absolute; inset: -14px;
  border-radius: 50%; border: 1px dashed var(--copper); opacity: 0.5;
  animation: spinSlow 40s linear infinite;
}
.node.pulsing .avatar {
  animation: pulseAv 2.6s ease-in-out infinite;
}
@keyframes pulseAv {
  0%,100% { box-shadow: 0 0 0 0 rgba(107,43,60,0.30); }
  50%     { box-shadow: 0 0 0 22px rgba(107,43,60,0); }
}
.node .label {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--wine-ink); opacity: 0.7;
}
.node .name {
  font-family: var(--serif); font-size: 24px; margin-top: 6px; color: var(--wine-ink);
  min-height: 32px;
}
.node .status {
  margin-top: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--copper);
}

.link-thread {
  position: relative;
  width: 220px; height: 40px;
}
@media (max-width: 720px) {
  .link-thread { width: 100%; height: 60px; }
}
.link-thread svg { width: 100%; height: 100%; overflow: visible; }
.link-thread path {
  fill: none; stroke: var(--wine); stroke-width: 1.25;
  stroke-dasharray: 6 6;
  opacity: 0.55;
  transition: all .6s;
}
body.state-enrolled .link-thread path { stroke-dasharray: 4 6; opacity: 0.75; }
body.state-unlocked .link-thread path {
  stroke: var(--copper); stroke-dasharray: 0; opacity: 1;
  filter: drop-shadow(0 0 6px rgba(232,185,156,0.6));
}

/* Enrollment card */
.enroll-card {
  margin: 56px auto 0;
  max-width: 560px;
  padding: 40px;
  background: rgba(255,255,255,0.5);
  border: 1px solid var(--line);
  border-radius: 20px;
  text-align: center;
  backdrop-filter: blur(4px);
}
.enroll-card h3 {
  font-family: var(--serif);
  font-weight: 500; font-size: 28px;
  margin: 0 0 10px; color: var(--wine-ink);
}
.enroll-card p {
  margin: 0 0 24px; color: var(--ink-mute); font-size: 15px;
}
.enroll-input {
  width: 100%;
  font-family: var(--serif);
  font-size: 32px; text-align: center;
  background: transparent;
  border: none;
  border-bottom: 1.5px solid var(--line-strong);
  padding: 12px 4px 14px;
  color: var(--wine-ink);
  outline: none;
  transition: border-color .3s;
}
.enroll-input:focus { border-color: var(--wine); }
.enroll-input::placeholder { color: rgba(107,43,60,0.35); font-style: italic; }

.code-box {
  margin: 28px auto 0;
  display: inline-flex; align-items: center; gap: 12px;
  padding: 14px 22px;
  background: var(--wine-ink); color: var(--peach);
  border-radius: 12px;
  font-family: var(--mono); font-size: 22px; letter-spacing: 0.24em;
}
.code-box .copy {
  font-size: 10px; padding: 6px 10px;
  background: rgba(232,185,156,0.15); color: var(--peach);
  border: 1px solid rgba(232,185,156,0.3);
  border-radius: 6px; cursor: pointer;
  letter-spacing: 0.16em;
  transition: background .2s;
}
.code-box .copy:hover { background: rgba(232,185,156,0.3); }

.simulate-cta {
  margin-top: 28px;
  font-family: var(--serif); font-style: italic; font-size: 14px;
  color: var(--ink-mute);
}
.simulate-cta button {
  margin-left: 8px;
  background: transparent; border: none; color: var(--copper);
  border-bottom: 1px solid var(--copper);
  font-family: var(--serif); font-style: italic; font-size: 14px;
  cursor: pointer; padding: 2px 0;
}
.simulate-cta button:hover { color: var(--wine); border-color: var(--wine); }

/* ---------- Unlock (dark cinematic) ---------- */
.dark-scene {
  background: var(--wine-ink);
  color: var(--peach);
  padding: 140px 40px;
  position: relative;
  overflow: hidden;
}
.dark-scene::before {
  content: ""; position: absolute; inset: -20%;
  background: radial-gradient(circle at 50% 30%, rgba(232,185,156,0.12), transparent 60%);
  pointer-events: none;
}
.dark-scene .eyebrow { color: var(--peach); }
.dark-inner {
  max-width: var(--content-max); margin: 0 auto;
  position: relative; z-index: 2;
}
.unlock-stage {
  display: flex; align-items: center; justify-content: center; gap: 24px;
  margin: 40px 0 60px;
}
.unlock-node {
  width: 96px; height: 96px; border-radius: 50%;
  background: var(--wine-dark);
  border: 1.5px solid rgba(232,185,156,0.5);
  display: flex; align-items: center; justify-content: center;
  color: var(--peach); font-family: var(--serif); font-size: 32px;
  transition: transform 1.2s cubic-bezier(.2,.7,.2,1);
}
.unlock-stage .thread-line {
  flex: 1; max-width: 220px; height: 1.5px;
  background: linear-gradient(90deg, var(--peach), rgba(232,185,156,0.2), var(--peach));
  background-size: 200% 100%;
  animation: shimmer 2.5s linear infinite;
  position: relative;
}
@keyframes shimmer { to { background-position: -200% 0; } }
body.state-unlocked .unlock-stage .thread-line { background: var(--peach); animation: none; }

.locked-badge {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 18px;
  border: 1px solid rgba(232,185,156,0.4);
  border-radius: 999px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--peach);
}
.locked-badge.unlocked {
  background: var(--peach); color: var(--wine-ink);
  border-color: var(--peach);
  box-shadow: 0 0 30px rgba(232,185,156,0.4);
}
.unlock-title {
  font-family: var(--serif);
  font-size: clamp(40px, 6vw, 76px);
  line-height: 1.02; letter-spacing: -0.02em;
  margin: 22px 0 18px;
  color: var(--blush);
}
.unlock-title .em { font-style: italic; color: var(--peach); }
.unlock-sub { max-width: 520px; color: rgba(251,244,241,0.7); font-size: 17px; line-height: 1.6; }

.snick-reveal {
  margin-top: 60px; max-width: 560px;
  padding: 36px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(232,185,156,0.25);
  border-radius: 20px;
  transition: all .6s;
  opacity: 0; transform: translateY(20px);
}
body.state-unlocked .snick-reveal { opacity: 1; transform: translateY(0); }
.snick-reveal .stamp {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--peach); opacity: 0.8;
}
.snick-reveal .prompt {
  font-family: var(--serif); font-size: 32px; line-height: 1.2;
  color: var(--blush); margin: 12px 0 24px;
  letter-spacing: -0.01em;
}

/* ---------- Meet the snicks ---------- */
.snick-gallery {
  padding: 140px 40px;
  max-width: var(--content-max);
  margin: 0 auto;
}
.gallery-header { max-width: 640px; margin-bottom: 80px; }
.gallery-header h2 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(40px, 6vw, 72px);
  line-height: 0.98; letter-spacing: -0.02em;
  color: var(--wine-ink); margin: 12px 0 24px;
}
.gallery-header h2 .em { font-style: italic; color: var(--wine); }
.gallery-header p { color: var(--ink-mute); font-size: 17px; max-width: 480px; }

.snick-list { display: grid; gap: 32px; }
.snick-item {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 32px;
  align-items: start;
}
.snick-item:nth-child(even) .envelope { justify-self: end; }

.envelope {
  position: relative;
  width: 100%;
  max-width: 480px;
  aspect-ratio: 4/3;
  perspective: 1200px;
  cursor: pointer;
}
.envelope-inner {
  position: absolute; inset: 0;
  border-radius: 14px;
  overflow: hidden;
  background: var(--blush-2);
  border: 1px solid var(--line);
  transition: transform .6s cubic-bezier(.2,.7,.2,1), box-shadow .6s;
  transform-style: preserve-3d;
}
.envelope:hover .envelope-inner {
  transform: rotateX(2deg) rotateY(-3deg) translateY(-4px);
  box-shadow: 0 40px 60px -30px rgba(58,22,32,0.35);
}
.envelope-flap {
  position: absolute; top: 0; left: 0; width: 100%; height: 55%;
  background: linear-gradient(180deg, var(--wine), var(--wine-dark));
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform .7s cubic-bezier(.6,-0.2,.4,1.2);
  z-index: 2;
}
.envelope.open .envelope-flap {
  transform: rotateX(-172deg);
}
.envelope-body {
  position: absolute; inset: 0;
  padding: 28px;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.envelope-body .num {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.28em;
  color: var(--copper);
}
.envelope-body .kind {
  font-family: var(--serif); font-style: italic;
  font-size: 42px; color: var(--wine-ink); margin: 4px 0 12px;
  line-height: 1;
}
.envelope-body .q {
  font-family: var(--serif); font-size: 20px; line-height: 1.3;
  color: var(--wine-ink); max-width: 320px;
  opacity: 0.85;
}
.envelope-body .hint {
  margin-top: 14px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--copper); opacity: 0.7;
}

/* Mystery envelope */
.envelope.mystery .envelope-inner {
  background: var(--wine-ink);
  border-color: var(--wine-dark);
}
.envelope.mystery .envelope-flap {
  background: linear-gradient(180deg, var(--wine-dark), var(--wine-ink));
}
.envelope.mystery .envelope-body .num,
.envelope.mystery .envelope-body .kind,
.envelope.mystery .envelope-body .q,
.envelope.mystery .envelope-body .hint {
  color: var(--peach);
}
.envelope.mystery .envelope-body .q {
  filter: blur(4px); opacity: 0.55;
}
.mystery-lock {
  position: absolute; top: 20px; right: 20px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--peach);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; background: rgba(232,185,156,0.12);
  border-radius: 999px;
}

/* snick side meta */
.snick-side {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.24em;
  text-transform: uppercase; color: var(--wine); opacity: 0.7;
  padding-top: 24px;
}

@media (max-width: 720px) {
  .snick-item { grid-template-columns: 40px 1fr; gap: 16px; }
  .snick-item:nth-child(even) .envelope { justify-self: start; }
}

/* ---------- Morph section ---------- */
.morph-scene {
  min-height: 200vh;
  position: relative;
  padding: 0;
}
.morph-sticky {
  position: sticky; top: 0;
  height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; overflow: hidden;
}
.morph-eyebrow { color: var(--wine); margin-bottom: 24px; }
.morph-word {
  font-family: var(--serif);
  font-size: clamp(64px, 15vw, 220px);
  font-weight: 600;
  color: var(--wine-ink);
  line-height: 1; letter-spacing: -0.03em;
  position: relative;
  transition: color .8s;
}
.morph-word .em { font-style: italic; color: var(--wine); }
.morph-caption {
  margin-top: 22px; font-family: var(--serif); font-style: italic;
  color: var(--ink-mute); font-size: 18px; max-width: 460px;
}

.chat-ghosts {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 0;
  overflow: hidden;
}
.chat-ghost {
  position: absolute;
  padding: 12px 18px;
  background: rgba(107,43,60,0.06);
  border-radius: 18px;
  font-size: 13px; color: var(--wine-ink);
  font-family: var(--sans);
  border: 1px solid rgba(107,43,60,0.08);
  max-width: 260px;
  transition: opacity 1s, transform 1.5s;
}

/* ---------- Ecosystem ---------- */
.eco {
  padding: 140px 40px;
  max-width: 1280px; margin: 0 auto;
}
.eco-head { max-width: 640px; margin-bottom: 60px; }
.eco-head h2 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(36px, 5vw, 60px);
  line-height: 1.02; letter-spacing: -0.02em; color: var(--wine-ink);
  margin: 12px 0 18px;
}
.eco-head p { color: var(--ink-mute); font-size: 16px; }
.eco-list {
  display: grid; gap: 0;
  border-top: 1px solid var(--line);
}
.eco-item {
  display: grid;
  grid-template-columns: 80px 220px 1fr auto;
  gap: 32px;
  padding: 34px 12px;
  border-bottom: 1px solid var(--line);
  align-items: center;
  transition: background .3s, padding .3s;
  cursor: default;
}
.eco-item:hover { background: rgba(232,185,156,0.10); padding-left: 24px; }
.eco-num { font-family: var(--mono); font-size: 12px; letter-spacing: 0.24em; color: var(--copper); }
.eco-name {
  font-family: var(--serif); font-size: 32px; color: var(--wine-ink);
  font-weight: 500; letter-spacing: -0.01em;
}
.eco-name .em { font-style: italic; color: var(--wine); }
.eco-desc { color: var(--ink-mute); font-size: 15px; max-width: 460px; line-height: 1.55; }
.eco-tag {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--wine); opacity: 0.65;
}
@media (max-width: 900px) {
  .eco-item { grid-template-columns: 50px 1fr; row-gap: 8px; }
  .eco-desc, .eco-tag { grid-column: 2/-1; }
}

/* ---------- Mini snick / share ---------- */
.mini-wrap {
  padding: 120px 40px;
  max-width: 1200px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 60px; align-items: center;
}
@media (max-width: 900px) { .mini-wrap { grid-template-columns: 1fr; } }

.mini-panel h3 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(32px, 4vw, 52px);
  color: var(--wine-ink); line-height: 1.05;
  margin: 14px 0 16px;
}
.mini-panel h3 .em { font-style: italic; color: var(--wine); }

.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: rgba(232,185,156,0.25);
  color: var(--wine-dark);
  border-radius: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase;
}

.mini-options { margin: 24px 0 8px; display: flex; flex-direction: column; gap: 10px; }
.mini-opt {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px;
  background: rgba(107,43,60,0.03);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-family: var(--serif); font-size: 18px;
  color: var(--wine-ink);
  cursor: pointer;
  transition: all .25s;
  text-align: left;
}
.mini-opt:hover { background: rgba(232,185,156,0.12); border-color: var(--copper); transform: translateX(4px); }
.mini-opt.selected { background: var(--wine); color: var(--peach); border-color: var(--wine); }
.mini-opt .idx { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; opacity: 0.5; }

/* Share card 9:16 */
.share-card {
  width: 100%;
  max-width: 320px;
  aspect-ratio: 9/16;
  margin: 0 auto;
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  background: var(--wine-ink);
  color: var(--blush);
  padding: 36px 26px;
  display: flex; flex-direction: column;
  box-shadow: 0 40px 80px -30px rgba(58,22,32,0.45);
  transition: transform .5s;
}
.share-card:hover { transform: rotate(-1.5deg) translateY(-4px); }
.share-card::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.9  0 0 0 0 0.7  0 0 0 0 0.6  0 0 0 0.25 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay; opacity: 0.5;
}
.share-card .top {
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em;
  color: var(--peach); opacity: 0.8;
}
.share-card .aperture {
  width: 150px; height: 150px; border-radius: 50%;
  margin: auto;
  background:
    radial-gradient(circle at 35% 30%, rgba(232,185,156,0.7), transparent 55%),
    radial-gradient(circle at center, var(--wine), var(--wine-ink));
  border: 1.5px solid var(--peach);
  position: relative;
  box-shadow: 0 0 40px rgba(232,185,156,0.25);
  display: flex; align-items: center; justify-content: center;
}
.share-card .aperture .score {
  font-family: var(--serif); font-size: 60px; color: var(--peach);
  font-weight: 600; line-height: 1;
}
.share-card .archetype {
  text-align: center; margin-top: 20px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.32em; color: var(--peach);
}
.share-card .archetype .big {
  display: block; font-family: var(--serif); font-size: 30px; color: var(--blush);
  font-style: italic; letter-spacing: -0.01em; text-transform: none;
  margin-top: 6px;
}
.share-card .foot {
  margin-top: auto;
  display: flex; justify-content: space-between; align-items: flex-end;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em;
  color: var(--peach); opacity: 0.8;
}
.share-card .foot .brand { color: var(--blush); letter-spacing: 0.28em; font-size: 10px; }

/* ---------- Final CTA ---------- */
.final {
  padding: 140px 40px 180px;
  text-align: center;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(232,185,156,0.25), transparent 55%),
    var(--blush);
  border-top: 1px solid var(--line);
}
.final h2 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(48px, 8vw, 120px);
  line-height: 1; letter-spacing: -0.03em;
  color: var(--wine-ink);
  margin: 0 auto 48px;
  max-width: 900px;
}
.final h2 .em { font-style: italic; color: var(--wine); }

.final-duo {
  position: relative;
  width: min(560px, 90%);
  height: 200px; margin: 0 auto 48px;
  display: flex; align-items: center; justify-content: space-between;
}
.final-node {
  width: 120px; height: 120px; border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  background: rgba(107,43,60,0.04);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 20px; color: var(--wine);
  transition: all .5s;
}
.final-node.filled { background: var(--wine); color: var(--peach); border-color: var(--wine); }
.final-loop {
  position: absolute; inset: 0;
  pointer-events: none;
}
.final-loop svg { width: 100%; height: 100%; overflow: visible; }
.final-loop path {
  fill: none; stroke: var(--wine); stroke-width: 1.5;
  stroke-dasharray: 8 8; opacity: 0.4;
  transition: all .8s;
}
body.state-unlocked .final-loop path {
  stroke-dasharray: 0; stroke: var(--copper); opacity: 0.9;
  filter: drop-shadow(0 0 6px rgba(232,185,156,0.6));
}

.tagline {
  margin-top: 28px;
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--wine);
}

footer {
  padding: 40px;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--wine); opacity: 0.7;
}
@media (max-width: 720px) { footer { flex-direction: column; gap: 12px; text-align: center; } }

/* ---------- State HUD (bottom right pill) ---------- */
.hud {
  position: fixed;
  bottom: 20px; right: 20px;
  z-index: 80;
  background: rgba(30,14,19,0.92);
  color: var(--peach);
  padding: 14px 18px 14px 14px;
  border-radius: 16px;
  font-family: var(--mono);
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  display: flex; align-items: center; gap: 14px;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(232,185,156,0.2);
  box-shadow: 0 20px 40px -20px rgba(0,0,0,0.4);
  min-width: 240px;
  max-width: calc(100vw - 40px);
  transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .5s;
}
.hud.collapsed { transform: translateY(120%); opacity: 0; }
.hud .hud-mark { width: 8px; height: 8px; border-radius: 50%; background: var(--peach); animation: breathe 3s ease-in-out infinite; flex-shrink: 0; }
.hud .col { display: flex; flex-direction: column; gap: 3px; }
.hud .k { opacity: 0.55; font-size: 8px; letter-spacing: 0.24em; }
.hud .v { color: var(--blush); letter-spacing: 0.14em; font-size: 11px; font-weight: 500; }
.hud .sep { width: 1px; height: 26px; background: rgba(232,185,156,0.15); }
.hud .reset {
  margin-left: auto;
  background: transparent; border: 1px solid rgba(232,185,156,0.2);
  color: var(--peach); font-family: var(--mono); font-size: 9px;
  padding: 5px 8px; border-radius: 6px; cursor: pointer; letter-spacing: 0.14em;
}
.hud .reset:hover { background: rgba(232,185,156,0.1); }
@media (max-width: 480px) {
  .hud { bottom: 12px; right: 12px; left: 12px; min-width: 0; }
}

/* Whisper microcopy that floats near the hero orb */
.floater {
  position: absolute;
  font-family: var(--serif); font-style: italic;
  color: var(--wine); font-size: 14px;
  opacity: 0; pointer-events: none;
  transition: opacity 1s ease;
  white-space: nowrap;
}
.floater.show { opacity: 0.7; }

/* Utility: fade-in on view */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity .9s, transform .9s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: none; }

/* Hide the enrollment step area until active state */
.only-enrolled, .only-unlocked { display: none; }
body.state-enrolled .only-enrolled { display: block; }
body.state-waiting  .only-enrolled { display: block; }
body.state-unlocked .only-enrolled { display: block; }
body.state-unlocked .only-unlocked { display: block; }

.only-visitor { display: block; }
body.state-enrolled .only-visitor,
body.state-waiting  .only-visitor,
body.state-unlocked .only-visitor { display: none; }

/* ============================================================
   V2 — SNICKYLINK expanded content sections
   ============================================================ */

/* ---------- Hero: campaign line, stats, session HUD ---------- */
.hero-eyebrow { flex-wrap: wrap; }
.campaign-line {
  font-size: 10px; letter-spacing: 0.24em; color: var(--wine);
  background: rgba(107,43,60,0.06);
  border: 1px solid var(--line);
  padding: 6px 12px; border-radius: 999px;
}
.hero-stats {
  margin-top: 42px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 22px 0;
}
.hero-stat { text-align: left; }
.hero-stat .v {
  font-size: 44px; color: var(--wine-ink); font-weight: 500;
  letter-spacing: -0.03em; line-height: 1;
}
.hero-stat .k {
  font-size: 12px; color: var(--ink-mute); margin-top: 6px;
  line-height: 1.35;
}
@media (max-width: 640px) {
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
  .hero-stat .v { font-size: 34px; }
}

/* Session HUD — right side of hero */
.session-hud {
  background: linear-gradient(180deg, #221016 0%, #1e0e13 100%);
  color: var(--peach-soft);
  border: 1px solid rgba(232,185,156,0.15);
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 30px 60px -30px rgba(58,22,32,0.45);
  position: relative;
  overflow: hidden;
  max-width: 480px;
  margin-left: auto;
}
.session-hud::before {
  content: '';
  position: absolute; inset: -40% -20% auto auto;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(232,185,156,0.22), transparent 60%);
  pointer-events: none;
}
.hud-band {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 9px; letter-spacing: 0.22em;
  color: rgba(232,185,156,0.6);
  margin-bottom: 18px;
  gap: 12px; flex-wrap: wrap;
}
.hud-band .session-id { color: var(--peach); }
.hud-players {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px;
  align-items: center;
  padding: 14px 0;
  border-top: 1px dashed rgba(232,185,156,0.15);
  border-bottom: 1px dashed rgba(232,185,156,0.15);
}
.hud-player { display: flex; gap: 12px; align-items: flex-start; }
.hud-player:last-child { flex-direction: row-reverse; text-align: right; }
.hud-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  background-size: cover; background-position: center;
  border: 1.5px solid var(--peach);
  position: relative; flex-shrink: 0;
  box-shadow: 0 0 0 4px rgba(232,185,156,0.14);
}
.hud-avatar .ok {
  position: absolute; bottom: -4px; right: -4px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--copper); color: #fff;
  font-size: 10px; display: flex; align-items: center; justify-content: center;
  border: 2px solid #1e0e13;
}
.hud-name { font-family: var(--serif); font-size: 18px; color: var(--peach); }
.hud-loc { font-size: 10px; color: rgba(232,185,156,0.7); margin-top: 2px; }
.hud-status { font-size: 11px; color: rgba(232,185,156,0.9); margin-top: 6px; }
.hud-sub { font-size: 10px; color: rgba(232,185,156,0.55); margin-top: 2px; font-style: italic; }
.hud-lock {
  position: relative;
  width: 90px; height: 90px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232,185,156,0.15), transparent 70%);
}
.hud-lock-num {
  font-size: 22px; color: var(--peach); line-height: 1;
  letter-spacing: -0.02em;
}
.hud-lock-label {
  position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
  font-size: 8px; color: rgba(232,185,156,0.7); white-space: nowrap;
  letter-spacing: 0.2em;
}
.hud-orbit {
  position: absolute; inset: 0; width: 100%; height: 100%;
  animation: hudSpin 12s linear infinite;
}
.hud-orbit circle { fill: none; stroke: rgba(232,185,156,0.4); stroke-width: 0.5; stroke-dasharray: 4 6; }
@keyframes hudSpin { to { transform: rotate(360deg); } }

.hud-prompt {
  display: flex; gap: 14px; align-items: flex-start;
  margin-top: 22px; padding: 14px;
  background: rgba(232,185,156,0.05);
  border: 1px solid rgba(232,185,156,0.15);
  border-radius: 12px;
}
.candle { font-size: 22px; filter: drop-shadow(0 0 6px rgba(232,185,156,0.6)); }
.prompt-line {
  font-size: 15px; font-style: italic; color: var(--peach-soft);
  line-height: 1.45; margin-top: 3px;
}
.hud-reveal { width: 100%; margin-top: 14px; justify-content: center; display: flex; }
.hud-reveal-log {
  margin-top: 14px; padding: 12px; border-radius: 10px;
  background: rgba(107,43,60,0.35);
  border: 1px solid rgba(232,185,156,0.12);
  font-size: 12px; color: rgba(232,185,156,0.9);
  line-height: 1.5;
}
.hud-reveal-log .tag { display: block; color: var(--peach); font-size: 10px; margin-bottom: 6px; }
.hud-reveal-log p { margin: 4px 0; }
.hud-reveal-log b { color: var(--peach); font-family: var(--serif); font-weight: 500; }
.hud-reveal-log .streak { display: block; color: rgba(232,185,156,0.55); font-size: 9px; margin-top: 8px; }

@media (max-width: 900px) {
  .session-hud { margin: 30px auto 0; }
}

/* ---------- Ticker ---------- */
.ticker-wrap {
  position: relative;
  background: var(--wine-ink);
  color: var(--peach);
  padding: 18px 0;
  overflow: hidden;
  border-top: 1px solid var(--line-peach);
  border-bottom: 1px solid var(--line-peach);
}
.ticker-track {
  display: flex;
  gap: 40px;
  white-space: nowrap;
  animation: tickerScroll 40s linear infinite;
  font-family: var(--serif);
  font-size: 32px;
  font-style: italic;
  letter-spacing: -0.01em;
}
.ticker-track span { flex-shrink: 0; padding-right: 40px; }
@keyframes tickerScroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ---------- Story: Normal Tuesday ---------- */
.story {
  padding: 120px 0 80px;
  background: var(--blush);
  position: relative;
}
.story-head { text-align: center; margin-bottom: 60px; }
.story-head h2 {
  font-size: clamp(38px, 5vw, 64px);
  font-weight: 500; color: var(--wine-ink);
  margin: 12px 0 8px; letter-spacing: -0.02em;
}
.story-head .scroll-hint {
  color: var(--copper); font-size: 10px; letter-spacing: 0.4em; margin-top: 12px;
}
.beats { display: flex; flex-direction: column; gap: 30px; max-width: 780px; margin: 0 auto; padding-left: 20px; }
.beat {
  display: grid; grid-template-columns: 60px 1fr; gap: 22px;
  padding: 24px 26px 24px 0;
  border-left: 1px solid var(--line-strong);
  padding-left: 26px;
  position: relative;
}
.beat::before {
  content: ''; position: absolute; left: -6px; top: 30px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--blush); border: 2px solid var(--wine);
}
.beat-idx {
  font-size: 42px; color: var(--wine); opacity: 0.35;
  letter-spacing: -0.02em; line-height: 1;
}
.beat-time { color: var(--copper); font-size: 10px; letter-spacing: 0.24em; margin-bottom: 8px; }
.beat-lead { font-size: 22px; color: var(--wine-ink); margin-bottom: 4px; letter-spacing: -0.01em; }
.beat-sub { color: var(--ink-mute); font-size: 14px; margin-bottom: 14px; }
.beat-chat { display: flex; flex-direction: column; gap: 6px; max-width: 380px; }
.bubble {
  padding: 8px 14px; border-radius: 16px;
  font-size: 14px; display: inline-flex; gap: 10px; align-items: center;
  width: fit-content; max-width: 100%;
}
.bubble.b-you {
  background: var(--wine); color: var(--blush);
  border-bottom-right-radius: 4px; margin-left: auto;
}
.bubble.b-them {
  background: rgba(107,43,60,0.08); color: var(--wine-ink);
  border-bottom-left-radius: 4px;
}
.bubble-meta { font-size: 9px; opacity: 0.6; letter-spacing: 0.14em; }

.serious-question {
  max-width: 780px; margin: 80px auto 40px; text-align: center;
  padding: 0 20px;
}
.serious-question h3 {
  font-family: var(--serif); font-size: clamp(28px, 4vw, 44px);
  color: var(--wine-ink); font-weight: 500; margin: 12px 0;
  letter-spacing: -0.015em;
}
.serious-question h3 em { color: var(--wine); font-style: italic; }
.serious-question p { color: var(--ink-mute); font-size: 16px; }

.pivot-quote {
  max-width: 780px; margin: 40px auto 0; text-align: center;
  padding: 40px 20px;
  border-top: 1px solid var(--line);
}
.pivot-quote blockquote {
  font-size: clamp(28px, 3.8vw, 40px); color: var(--wine);
  font-weight: 500; margin: 12px 0 40px;
  font-style: italic; letter-spacing: -0.015em; line-height: 1.2;
}
.pivot-quote blockquote em { color: var(--wine-ink); }
.pivot-cta .pivot-line { font-size: 26px; color: var(--wine-ink); margin-top: 4px; }

/* ---------- Pairing ---------- */
.pairing {
  padding: 120px 0 100px;
  background: linear-gradient(180deg, var(--blush) 0%, var(--blush-2) 100%);
}
.pairing-head { text-align: center; max-width: 640px; margin: 0 auto 50px; }
.pairing-head h2 {
  font-size: clamp(32px, 4.5vw, 50px); color: var(--wine-ink);
  font-weight: 500; margin: 12px 0 10px; letter-spacing: -0.02em;
}
.pairing-head p { color: var(--ink-mute); }

.pair-card {
  max-width: 700px; margin: 0 auto;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 30px 60px -30px rgba(58,22,32,0.15);
}
.pair-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.pair-tab {
  background: rgba(107,43,60,0.03); border: none; padding: 18px 20px;
  font-family: var(--sans); font-size: 13px; color: var(--ink-mute);
  cursor: pointer; text-align: left;
  border-right: 1px solid var(--line);
  transition: all .25s;
}
.pair-tab:last-child { border-right: none; }
.pair-tab .mono { display: inline-block; margin-right: 8px; color: var(--wine); font-size: 10px; letter-spacing: 0.14em; background: rgba(107,43,60,0.08); padding: 2px 6px; border-radius: 4px; }
.pair-tab.on { background: #fff; color: var(--wine-ink); font-weight: 600; }
.pair-tab:hover { color: var(--wine); }

.pair-body {
  padding: 46px 34px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.pair-key-icon { font-size: 40px; filter: drop-shadow(0 4px 8px rgba(107,43,60,0.2)); }
.pair-code {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 18px 24px; margin: 6px 0;
  background: rgba(107,43,60,0.05);
  border: 1.5px dashed var(--wine);
  border-radius: 14px;
}
.pair-code .serif { font-size: 42px; color: var(--wine-ink); letter-spacing: 0.18em; font-weight: 500; }
.pair-copy {
  background: var(--wine); color: var(--blush); border: none;
  padding: 8px 16px; border-radius: 999px; cursor: pointer;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
}
.pair-copy:hover { background: var(--wine-dark); }
.pair-note { color: var(--ink-mute); font-size: 16px; max-width: 400px; }
.pair-status { color: var(--copper); font-size: 11px; letter-spacing: 0.14em; display: flex; align-items: center; gap: 8px; }
.dot-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--copper); animation: dotP 1.5s ease-in-out infinite; }
@keyframes dotP { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; box-shadow: 0 0 12px var(--copper); } }

.pair-input-row {
  display: flex; gap: 10px; margin-top: 10px; width: 100%; max-width: 380px;
}
.pair-input {
  flex: 1; background: rgba(107,43,60,0.04);
  border: 1.5px solid var(--line-strong);
  border-radius: 12px;
  padding: 14px 18px;
  font-family: var(--serif); font-size: 20px; letter-spacing: 0.18em;
  color: var(--wine-ink); text-align: center;
  outline: none;
}
.pair-input:focus { border-color: var(--wine); }
.pair-error { color: var(--copper); font-size: 12px; margin-top: 6px; }
.pair-joined { padding-top: 40px; }
.pair-joined .btn { margin-top: 10px; }

.pair-foot { text-align: center; color: var(--wine); opacity: 0.55; font-size: 10px; letter-spacing: 0.24em; margin-top: 40px; }

/* ---------- Four Snicks Grid ---------- */
.four-snicks { padding: 120px 0 80px; background: var(--blush); }
.fs-head { text-align: center; max-width: 660px; margin: 0 auto 60px; }
.fs-head h2 { font-size: clamp(34px, 4.6vw, 54px); font-weight: 500; color: var(--wine-ink); margin: 12px 0 8px; letter-spacing: -0.02em; }
.fs-head p { color: var(--ink-mute); }
.fs-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;
  max-width: 1000px; margin: 0 auto;
}
@media (max-width: 720px) { .fs-grid { grid-template-columns: 1fr; } }
.fs-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px 26px 24px;
  display: flex; flex-direction: column; gap: 12px;
  transition: all .3s;
  position: relative; overflow: hidden;
}
.fs-card.unlocked { border-color: var(--peach); box-shadow: 0 20px 40px -20px rgba(184,101,74,0.25); }
.fs-card.locked { opacity: 0.72; }
.fs-card:hover { transform: translateY(-3px); }
.fs-card-head { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; }
.fs-tag { padding: 4px 10px; border-radius: 999px; letter-spacing: 0.16em; font-size: 9px; }
.fs-tag.unlocked { background: rgba(184,101,74,0.16); color: var(--copper); }
.fs-tag.locked   { background: rgba(107,43,60,0.06); color: var(--ink-mute); }
.fs-num { color: var(--ink-mute); font-size: 9px; letter-spacing: 0.14em; }
.fs-icon { font-size: 44px; align-self: flex-start; padding: 4px 0; filter: drop-shadow(0 4px 6px rgba(107,43,60,0.15)); }
.fs-card h3 { font-family: var(--serif); font-size: 26px; color: var(--wine-ink); margin: 0; font-weight: 500; letter-spacing: -0.015em; }
.fs-body { color: var(--ink-mute); font-size: 14px; line-height: 1.55; margin: 0; }
.fs-quote { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--wine); border-left: 2px solid var(--peach); padding-left: 12px; margin: 8px 0 12px; line-height: 1.4; }
.fs-cta {
  align-self: flex-start; padding: 10px 18px; border-radius: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
  cursor: pointer; border: 1px solid transparent;
  transition: all .2s;
}
.fs-cta.primary { background: var(--wine); color: var(--blush); border-color: var(--wine); }
.fs-cta.primary:hover { background: var(--wine-dark); }
.fs-cta.muted { background: transparent; color: var(--ink-mute); border-color: var(--line); cursor: not-allowed; }

/* ---------- Lock Rule ---------- */
.lock-rule {
  padding: 120px 0;
  background: linear-gradient(180deg, var(--wine-ink) 0%, #16080c 100%);
  color: var(--peach-soft);
}
.lr-head { text-align: center; max-width: 780px; margin: 0 auto 70px; }
.lr-head .eyebrow { color: var(--peach); opacity: 0.8; }
.lr-head h2 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(36px, 5vw, 60px); color: var(--peach);
  margin: 12px 0 12px; letter-spacing: -0.02em;
}
.lr-head h2 em { font-style: italic; color: var(--peach-soft); }
.lr-head p { color: rgba(242,213,190,0.7); }
.lr-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1100px; margin: 0 auto; }
@media (max-width: 820px) { .lr-steps { grid-template-columns: 1fr; } }
.lr-step {
  background: rgba(232,185,156,0.03);
  border: 1px solid rgba(232,185,156,0.15);
  border-radius: 18px;
  padding: 32px 28px;
}
.lr-num {
  font-size: 42px; color: var(--peach); opacity: 0.5;
  font-weight: 500; line-height: 1; margin-bottom: 18px;
}
.lr-content h3 {
  font-family: var(--serif); font-size: 24px; color: var(--peach);
  font-weight: 500; margin: 0 0 12px; letter-spacing: -0.01em;
}
.lr-content p { color: rgba(242,213,190,0.78); line-height: 1.6; font-size: 14px; }
.lr-state {
  margin-top: 20px; font-size: 10px; letter-spacing: 0.18em;
  color: var(--copper);
  padding: 8px 12px; border-radius: 6px;
  background: rgba(184,101,74,0.14);
  display: inline-block;
}

/* ---------- Demo ---------- */
.demo {
  padding: 120px 0;
  background: linear-gradient(180deg, #16080c 0%, #1e0e13 100%);
  color: var(--peach-soft);
}
.demo-head { text-align: center; max-width: 780px; margin: 0 auto 40px; }
.demo-head .eyebrow { color: var(--peach); opacity: 0.85; }
.demo-head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(32px, 4.6vw, 52px); color: var(--peach); margin: 12px 0; letter-spacing: -0.02em; }
.demo-head h2 em { color: var(--peach-soft); font-style: italic; }
.demo-head p { color: rgba(242,213,190,0.75); }

.demo-stepper {
  display: flex; justify-content: center; align-items: center;
  gap: 14px; flex-wrap: wrap; margin: 30px 0 40px;
  font-size: 11px; letter-spacing: 0.14em;
  color: rgba(242,213,190,0.5);
}
.ds { padding: 8px 14px; border: 1px dashed rgba(232,185,156,0.2); border-radius: 999px; }
.ds.on { color: var(--peach); border-color: var(--peach); background: rgba(232,185,156,0.06); }
.ds-sep { color: rgba(242,213,190,0.35); }

.demo-prompt {
  display: flex; gap: 18px; align-items: flex-start;
  max-width: 780px; margin: 0 auto 40px;
  padding: 20px 24px;
  background: rgba(232,185,156,0.05);
  border: 1px solid rgba(232,185,156,0.15);
  border-radius: 14px;
}
.dp-moon { font-size: 28px; }
.dp-line { font-family: var(--serif); font-style: italic; color: var(--peach); font-size: 22px; margin: 6px 0; line-height: 1.35; }
.dp-sealed { color: rgba(242,213,190,0.55); font-size: 10px; letter-spacing: 0.2em; }

.demo-phones {
  display: grid; grid-template-columns: 1fr 1fr; gap: 22px;
  max-width: 1000px; margin: 0 auto;
}
@media (max-width: 820px) { .demo-phones { grid-template-columns: 1fr; } }

.phone {
  background: linear-gradient(180deg, #2a141b 0%, #1e0e13 100%);
  border: 1px solid rgba(232,185,156,0.18);
  border-radius: 22px;
  padding: 24px;
  min-height: 360px;
  display: flex; flex-direction: column;
  transition: all .35s;
}
.phone.dim { opacity: 0.55; }
.phone.locked { border-color: var(--peach); box-shadow: 0 20px 50px -30px rgba(232,185,156,0.35); }
.phone-head { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed rgba(232,185,156,0.12); }
.ph-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background-size: cover; background-position: center;
  border: 1.5px solid var(--peach);
  flex-shrink: 0;
}
.ph-avatar.sm { width: 36px; height: 36px; }
.ph-name { font-family: var(--serif); color: var(--peach); font-size: 18px; }
.ph-you { color: rgba(232,185,156,0.55); font-size: 9px; letter-spacing: 0.14em; margin-left: 6px; }
.ph-loc { color: rgba(232,185,156,0.6); font-size: 10px; letter-spacing: 0.12em; margin-top: 2px; }
.ph-label { font-size: 10px; color: var(--copper); letter-spacing: 0.16em; margin-bottom: 8px; }
.preset-list { display: flex; flex-direction: column; gap: 8px; }
.preset {
  text-align: left; padding: 12px 14px;
  border-radius: 10px;
  background: rgba(232,185,156,0.04);
  border: 1px solid rgba(232,185,156,0.15);
  color: rgba(242,213,190,0.85);
  font-family: var(--serif); font-style: italic; font-size: 13px; line-height: 1.4;
  cursor: pointer; transition: all .2s;
}
.preset:hover { border-color: var(--peach); background: rgba(232,185,156,0.08); }
.preset.on { border-color: var(--peach); background: rgba(232,185,156,0.12); color: var(--peach); }
.ph-textarea {
  width: 100%; margin-top: 6px;
  background: rgba(232,185,156,0.04);
  border: 1px solid rgba(232,185,156,0.2);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--peach-soft);
  font-family: var(--serif); font-style: italic; font-size: 13px;
  outline: none; resize: vertical;
}
.ph-textarea:focus { border-color: var(--peach); }
.ph-lock { margin-top: 16px; align-self: flex-start; }
.ph-warn { color: rgba(232,185,156,0.5); font-size: 9px; letter-spacing: 0.16em; margin-top: 10px; }

.phone-sealed { text-align: center; padding: 30px 10px; margin: auto 0; }
.seal-icon { font-size: 50px; filter: drop-shadow(0 0 12px rgba(232,185,156,0.35)); }
.ph-status-tag { color: var(--copper); font-size: 11px; letter-spacing: 0.2em; margin-top: 12px; }
.phone-await { text-align: center; padding: 30px 10px; margin: auto 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.await-icon { font-size: 44px; }
.ph-protect { color: var(--peach); font-size: 9px; letter-spacing: 0.24em; margin-top: 4px; }
.meher-ans { color: var(--peach); font-size: 14px; padding: 12px; background: rgba(232,185,156,0.06); border-radius: 10px; margin: 8px 0; line-height: 1.5; max-width: 300px; }

.sealed-note {
  max-width: 700px; margin: 30px auto 0; text-align: center;
  padding: 14px 20px; border-radius: 12px;
  background: rgba(232,185,156,0.05);
  border: 1px dashed rgba(232,185,156,0.2);
  color: var(--peach-soft); font-size: 14px;
}
.sealed-note .mono { color: var(--copper); font-size: 10px; letter-spacing: 0.18em; margin-left: 10px; }

.reveal-wrap { max-width: 1080px; margin: 0 auto; }
.reveal-banner {
  display: flex; gap: 20px; align-items: center;
  padding: 24px 26px;
  background: linear-gradient(90deg, rgba(184,101,74,0.16) 0%, rgba(232,185,156,0.08) 100%);
  border: 1px solid var(--peach);
  border-radius: 18px; margin-bottom: 30px;
}
.rb-emoji { font-size: 44px; filter: drop-shadow(0 0 10px rgba(232,185,156,0.4)); }

.reveal-pair {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  margin-bottom: 40px;
}
@media (max-width: 720px) { .reveal-pair { grid-template-columns: 1fr; } }
.reveal-card {
  background: rgba(232,185,156,0.05);
  border: 1px solid rgba(232,185,156,0.2);
  border-radius: 18px;
  padding: 24px;
}
.rc-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed rgba(232,185,156,0.15); }
.reveal-card blockquote { font-family: var(--serif); font-style: italic; color: var(--peach); font-size: 20px; line-height: 1.4; margin: 6px 0 0; }

/* IG Export */
.ig-export {
  display: grid; grid-template-columns: 1fr 320px; gap: 30px;
  padding: 30px; margin-top: 30px;
  background: rgba(232,185,156,0.03);
  border: 1px solid rgba(232,185,156,0.15);
  border-radius: 20px;
}
@media (max-width: 820px) { .ig-export { grid-template-columns: 1fr; } }
.ig-copy h3 { font-family: var(--serif); color: var(--peach); font-size: 26px; font-weight: 500; margin: 8px 0; letter-spacing: -0.01em; }
.ig-copy p { color: rgba(242,213,190,0.75); font-size: 14px; }
.frame-picks { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.frame-pick {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: 10px;
  background: rgba(232,185,156,0.05);
  border: 1px solid rgba(232,185,156,0.15);
  color: var(--peach-soft); font-size: 11px; letter-spacing: 0.08em;
  cursor: pointer;
}
.frame-pick.on { border-color: var(--peach); }
.frame-pick .swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.15); }
.ig-actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

.ig-card {
  aspect-ratio: 9/16;
  border-radius: 22px;
  padding: 28px 24px 24px;
  color: var(--peach-soft);
  display: flex; flex-direction: column; gap: 6px;
  position: relative; overflow: hidden;
  box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6);
  border: 1px solid rgba(232,185,156,0.2);
}
.ig-card::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 20%, rgba(232,185,156,0.18), transparent 60%);
  pointer-events: none;
}
.ig-crest { font-size: 28px; color: var(--peach); text-align: center; }
.ig-serial { text-align: center; font-size: 9px; letter-spacing: 0.2em; opacity: 0.6; margin-bottom: 12px; }
.ig-title { font-family: var(--serif); font-size: 28px; color: var(--peach); text-align: center; line-height: 1.1; letter-spacing: -0.01em; }
.ig-quote { font-family: var(--serif); font-style: italic; text-align: center; font-size: 15px; margin: auto 0; color: var(--peach-soft); line-height: 1.4; }
.ig-mini { text-align: center; font-size: 12px; font-style: italic; opacity: 0.7; margin-bottom: 8px; }
.ig-foot { text-align: center; font-size: 8px; letter-spacing: 0.24em; opacity: 0.6; }

/* ---------- Bond Levels ---------- */
.bond { padding: 120px 0 100px; background: var(--blush-2); }
.bond-head { text-align: center; max-width: 780px; margin: 0 auto 60px; }
.bond-head h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(34px, 4.8vw, 54px); color: var(--wine-ink); margin: 12px 0; letter-spacing: -0.02em; line-height: 1.15; }
.bond-head h2 em { color: var(--wine); font-style: italic; }
.bond-head p { color: var(--ink-mute); }

.worlds {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
  max-width: 1200px; margin: 0 auto;
}
@media (max-width: 1000px) { .worlds { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px)  { .worlds { grid-template-columns: 1fr; } }
.world {
  border-radius: 20px;
  padding: 24px 22px;
  background: #fff;
  border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 14px;
  min-height: 340px;
  transition: transform .3s;
  position: relative;
}
.world:hover { transform: translateY(-4px); }
.world.w-active { background: linear-gradient(180deg, #6B2B3C 0%, #3A1620 100%); color: var(--peach-soft); border-color: var(--peach); box-shadow: 0 30px 60px -30px rgba(58,22,32,0.5); }
.world.w-active h3, .world.w-active .world-num { color: var(--peach); }
.world.w-active p { color: rgba(242,213,190,0.8); }
.world.w-shipment { background: linear-gradient(180deg, #E8B99C 0%, #B8654A 100%); color: var(--wine-ink); }
.world.w-locked { opacity: 0.85; background: rgba(107,43,60,0.04); }
.world-tag {
  align-self: flex-start;
  padding: 4px 10px; border-radius: 999px;
  font-size: 9px; letter-spacing: 0.14em;
  background: rgba(107,43,60,0.08); color: var(--wine);
}

// ========== components/hooks.jsx ==========
// Shared hooks + tiny utilities
const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

// ---------- App-wide state context ----------
// STATES: visitor -> enrolled -> waiting -> unlocked -> completed
const STATE_LABELS = {
  visitor:   '01 · VISITOR · LOCKED',
  enrolled:  '02 · ENROLLED · WAITING',
  waiting:   '03 · WAITING FOR PARTNER',
  unlocked:  '04 · CONNECTED · UNLOCKED',
  completed: '05 · SNICK COMPLETE',
};

const AppCtx = createContext(null);

function AppProvider({ children }) {
  const [state, setState] = useState('visitor');
  const [name, setName] = useState('');
  const [partnerName, setPartnerName] = useState('');
  const [code, setCode] = useState('');
  const [xp, setXp] = useState(0);
  const [answer, setAnswer] = useState(null);

  // hydrate from localStorage once
  useEffect(() => {
    try {
      const raw = localStorage.getItem('snickylink_state');
      if (raw) {
        const s = JSON.parse(raw);
        if (s.state) setState(s.state);
        if (s.name) setName(s.name);
        if (s.partnerName) setPartnerName(s.partnerName);
        if (s.code) setCode(s.code);
        if (typeof s.xp === 'number') setXp(s.xp);
        if (s.answer) setAnswer(s.answer);
      }
    } catch(e) {}
  }, []);

  // persist
  useEffect(() => {
    try {
      localStorage.setItem('snickylink_state', JSON.stringify({ state, name, partnerName, code, xp, answer }));
    } catch(e) {}
  }, [state, name, partnerName, code, xp, answer]);

  // reflect on body class for CSS
  useEffect(() => {
    document.body.classList.remove('state-visitor','state-enrolled','state-waiting','state-unlocked','state-completed');
    document.body.classList.add('state-' + state);
  }, [state]);

  const reset = useCallback(() => {
    setState('visitor'); setName(''); setPartnerName(''); setCode(''); setXp(0); setAnswer(null);
    try { localStorage.removeItem('snickylink_state'); } catch(e) {}
  }, []);

  const value = { state, setState, name, setName, partnerName, setPartnerName,
                  code, setCode, xp, setXp, answer, setAnswer, reset, STATE_LABELS };
  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}
function useApp() { return useContext(AppCtx); }

// ---------- Mouse tracking (normalized -1..1) ----------
function useMouse() {
  const [m, setM] = useState({ x: 0, y: 0 });
  useEffect(() => {
    const onMove = (e) => {
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      setM({ x, y });
    };
    window.addEventListener('mousemove', onMove, { passive: true });
    return () => window.removeEventListener('mousemove', onMove);
  }, []);
  return m;
}

// ---------- IntersectionObserver reveal ----------
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const el = ref.current;
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) el.classList.add('in'); });
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

// ---------- Scroll progress within an element ----------
function useSectionProgress(ref) {
  const [p, setP] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      if (!ref.current) return;
      const r = ref.current.getBoundingClientRect();
      const vh = window.innerHeight;
      const total = r.height - vh;
      const scrolled = Math.min(Math.max(-r.top, 0), Math.max(total, 1));
      setP(scrolled / Math.max(total, 1));
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
  }, [ref]);
  return p;
}

// ---------- Utility ----------
function makeCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 4; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return 'SNK-' + out;
}

Object.assign(window, {
  AppProvider, useApp, useMouse, useReveal, useSectionProgress, makeCode, STATE_LABELS
});


// ========== components/thread.jsx ==========
// The Thread — a fixed SVG that runs the full document height on the left.
// - Wanders using cursor influence
// - Reveals as user scrolls
// - Pulses when unlocked
function Thread() {
  const svgRef = React.useRef(null);
  const pathRef = React.useRef(null);
  const pulseRef = React.useRef(null);
  const [h, setH] = React.useState(2000);
  const mouse = useMouse();
  const { state } = useApp();

  React.useEffect(() => {
    const measure = () => setH(document.body.scrollHeight);
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(document.body);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, []);

  // build the wandering path
  const d = React.useMemo(() => {
    const w = 200;
    const midX = w * 0.55;
    // sway amount influenced by cursor
    const sway = 30 + mouse.x * 18;
    const segs = Math.max(6, Math.floor(h / 260));
    let path = `M ${midX} 0`;
    for (let i = 1; i <= segs; i++) {
      const y = (h / segs) * i;
      const cx1 = midX + (i % 2 ? sway : -sway);
      const cx2 = midX + (i % 2 ? -sway : sway);
      const y1 = y - (h / segs) * 0.7;
      const y2 = y - (h / segs) * 0.3;
      path += ` C ${cx1} ${y1}, ${cx2} ${y2}, ${midX} ${y}`;
    }
    return path;
  }, [h, mouse.x]);

  // stroke reveal based on scroll
  React.useEffect(() => {
    const p = pathRef.current; if (!p) return;
    let len = 0;
    try { len = p.getTotalLength(); } catch(e) { return; }
    p.style.strokeDasharray = `${len} ${len}`;
    p.style.strokeDashoffset = `${len}`;
    const onScroll = () => {
      const scrolled = window.scrollY + window.innerHeight * 0.5;
      const total = document.body.scrollHeight;
      const pct = Math.min(1, Math.max(0, scrolled / total));
      p.style.strokeDashoffset = `${len * (1 - pct)}`;
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [d, state]);

  // Pulse light: dashed offset animation on the pulse path
  React.useEffect(() => {
    const p = pulseRef.current; if (!p) return;
    let len = 0;
    try { len = p.getTotalLength(); } catch(e) { return; }
    p.style.strokeDasharray = `40 ${len}`;
    let start = performance.now();
    let raf;
    const tick = (t) => {
      const elapsed = (t - start) / 1000;
      const speed = state === 'unlocked' ? 300 : 120;
      p.style.strokeDashoffset = `${-(elapsed * speed) % (len + 40)}`;
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [d, state]);

  return (
    <svg ref={svgRef} className="thread-svg" viewBox={`0 0 200 ${h}`} preserveAspectRatio="none" aria-hidden="true">
      {/* the main thread */}
      <path ref={pathRef} d={d} className="thread-path" />
      {/* pulse overlay (only visible when unlocked) */}
      <path ref={pulseRef} d={d} className="thread-pulse" />
    </svg>
  );
}
window.Thread = Thread;

// CHAT -> PLAY -> DISCOVER -> REMEMBER -> GROW -> "MORE THAN A CHAT"
// Scroll-linked word morph with dissolving chat bubbles.
const MORPH_WORDS = [
  { w: 'chat',     em: '',        cap: 'ordinary. words. pings. read receipts.' },
  { w: 'play',     em: 'play',    cap: 'tiny games only the two of you know.' },
  { w: 'discover', em: 'discover',cap: 'small answers you didn\'t know you had.' },
  { w: 'remember', em: 'remember',cap: 'a shared shelf of little moments.' },
  { w: 'grow',     em: 'grow',    cap: 'the streak, quietly, both of you.' },
  { w: 'more than a chat.', em: 'more than a chat.', cap: 'that\'s the whole thing.' },
];

const CHAT_LINES = [
  { t: "hey", x: '10%', y: '18%', d: 0 },
  { t: "hey", x: '78%', y: '22%', d: 0.05 },
  { t: "wyd", x: '15%', y: '68%', d: 0.1 },
  { t: "same", x: '75%', y: '72%', d: 0.15 },
  { t: "lol", x: '82%', y: '48%', d: 0.2 },
  { t: "k", x: '12%', y: '44%', d: 0.22 },
];

function MorphSection() {
  const ref = React.useRef(null);
  const p = useSectionProgress(ref);
  // index 0..MORPH_WORDS.length-1
  const idx = Math.min(MORPH_WORDS.length - 1, Math.floor(p * MORPH_WORDS.length));
  const local = (p * MORPH_WORDS.length) - idx; // 0..1 within a word
  const cur = MORPH_WORDS[idx];

  // chat bubbles fade as we progress
  const chatOpacity = Math.max(0, 1 - p * 2.4);

  return (
    <section className="morph-scene" ref={ref} data-screen-label="05 Morph">
      <div style={{ height: '200vh' }}>
        <div className="morph-sticky">
          <div className="chat-ghosts" aria-hidden="true">
            {CHAT_LINES.map((c, i) => (
              <div key={i} className="chat-ghost"
                   style={{
                     left: c.x, top: c.y,
                     opacity: chatOpacity * (1 - c.d),
                     transform: `translateY(${(1 - chatOpacity) * -60}px)`
                   }}>{c.t}</div>
            ))}
          </div>
          <div className="morph-eyebrow eyebrow">Ⅳ · Not the same</div>
          <div className="morph-word"
               key={idx}
               style={{
                 opacity: 0.15 + local * 0.85,
                 transform: `translateY(${(1 - local) * 20}px) scale(${0.94 + local * 0.06})`,
               }}>
            <span className={idx === MORPH_WORDS.length - 1 ? 'em' : (idx > 0 ? 'em' : '')}>{cur.w}</span>
          </div>
          <div className="morph-caption" key={'c' + idx}>{cur.cap}</div>
          <div style={{ position: 'absolute', bottom: 40, left: '50%', transform: 'translateX(-50%)',
                        fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '0.24em', color: 'var(--wine)', opacity: 0.5 }}>
            keep scrolling · {String(idx + 1).padStart(2,'0')} / {String(MORPH_WORDS.length).padStart(2,'0')}
          </div>
        </div>
      </div>
    </section>
  );
}

// Mini live snick — the visitor plays a miniature version of Snick #01.
// Choose one of four "sense" options, we generate their result.
const MINI_OPTS = [
  { key: 'song',  label: 'a song that plays in my head when they text.' },
  { key: 'smell', label: 'a smell that would make me turn around in a crowd.' },
  { key: 'time',  label: 'the exact minute they laughed too loud, once.' },
  { key: 'thing', label: 'the small object on their desk I keep noticing.' },
];

const RESULT_ARCHETYPES = {
  song:  { title: 'The Rememberer', score: 92, line: 'you two orbit each other like a chorus.' },
  smell: { title: 'The Sense-Keeper', score: 88, line: 'you notice the world through them.' },
  time:  { title: 'The Observer', score: 87, line: 'you two notice the little things.' },
  thing: { title: 'The Quiet One', score: 84, line: 'you don\'t say it — you place it near them.' },
};

function MiniSnick({ onComplete }) {
  const { state, answer, setAnswer, setState, setXp, xp } = useApp();
  const [sel, setSel] = React.useState(answer && answer.key || null);
  const [submitting, setSubmitting] = React.useState(false);

  const unlocked = state === 'unlocked' || state === 'completed';

  const submit = () => {
    if (!sel) return;
    setSubmitting(true);
    setTimeout(() => {
      const opt = MINI_OPTS.find(o => o.key === sel);
      const r = RESULT_ARCHETYPES[sel];
      setAnswer({ key: sel, label: opt.label, ...r });
      setXp((xp || 0) + 20);
      setState('completed');
      setSubmitting(false);
      onComplete && onComplete();
    }, 900);
  };

  return (
    <section className="mini-wrap threaded" id="mini" data-screen-label="07 Mini Snick">
      <div className="mini-panel">
        <span className="chip">Snick No. 01 · live · notice</span>
        <h3>Send them <span className="em">one thing</span> that instantly reminds you of them.</h3>
        <p style={{ color: 'var(--ink-mute)', fontSize: 16, marginTop: 8 }}>
          Not the person. Something <em style={{ fontStyle: 'italic', color: 'var(--wine)' }}>near</em> the person.
          Pick the one that lands first — no thinking.
        </p>

        {!unlocked && (
          <div style={{ marginTop: 24, padding: 20, background: 'rgba(107,43,60,0.05)', border: '1px solid var(--line)', borderRadius: 12 }}>
            <div className="eyebrow" style={{ marginBottom: 8 }}>still locked</div>
            <div style={{ fontFamily: 'var(--serif)', fontSize: 20, color: 'var(--wine-ink)' }}>
              Nice try. This one needs two. Scroll back up and bring your person in.
            </div>
          </div>
        )}

        {unlocked && (
          <>
            <div className="mini-options">
              {MINI_OPTS.map((o, i) => (
                <button key={o.key}
                        className={`mini-opt ${sel === o.key ? 'selected' : ''}`}
                        onClick={() => setSel(o.key)}>
                  <span className="idx">{String(i + 1).padStart(2,'0')}</span>
                  <span>{o.label}</span>
                </button>
              ))}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 20 }}>
              <button className="btn btn-primary" disabled={!sel || submitting} onClick={submit}>
                {submitting ? 'sending together…' : (state === 'completed' ? 'update our answer' : 'send it')} <span className="arrow">→</span>
              </button>
              {state === 'completed' && (
                <span style={{ fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--copper)' }}>
                  + 20 xp · connection lv. 1
                </span>
              )}
            </div>
          </>
        )}
      </div>

      <div>
        <ShareCard />
      </div>
    </section>
  );
}

// 9:16 Share card — personalized after mini snick.
function ShareCard() {
  const { state, name, partnerName, answer, code } = useApp();
  const complete = state === 'completed' && answer;
  const today = new Date();
  const stamp = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

  const title = complete ? answer.title : 'The Locked Pair';
  const score = complete ? answer.score : '??';
  const line  = complete ? answer.line : 'you two haven\'t played yet.';

  const share = async () => {
    const text = `${name || 'us'} & ${partnerName || 'them'} — ${title} · ${score}. ${line} · snickylink.com`;
    if (navigator.share) {
      try { await navigator.share({ title: 'Our Snick', text }); } catch(e) {}
    } else {
      try { await navigator.clipboard.writeText(text); alert('Result copied to clipboard.'); } catch(e) {}
    }
  };

  return (
    <div>
      <div style={{ textAlign: 'center', marginBottom: 18, fontFamily: 'var(--mono)', fontSize: 10, letterSpacing: '0.24em', textTransform: 'uppercase', color: 'var(--wine)', opacity: 0.7 }}>
        · your share card · 9:16 ·
      </div>
      <div className="share-card">
        <div className="top">
          <span>{stamp}</span>
          <span>{code || 'SNK-••••'}</span>
        </div>
        <div className="aperture">
          <div className="score">{score}</div>
        </div>
        <div className="archetype">
          the archetype
          <span className="big">"{title}"</span>
        </div>
        <div style={{ textAlign: 'center', marginTop: 14, fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 14, color: 'rgba(251,244,241,0.85)', maxWidth: 220, alignSelf: 'center', margin: '14px auto 0' }}>
          {line}
        </div>
        <div className="foot">
          <span>{(name || 'you').toLowerCase()} · {(partnerName || 'them').toLowerCase()}</span>
          <span className="brand">SNICKYLINK</span>
        </div>
      </div>
      <div style={{ textAlign: 'center', marginTop: 20 }}>
        <button className="btn btn-ghost" onClick={share} disabled={!complete}>
          {complete ? 'share your result' : 'complete the snick first'} <span className="arrow">→</span>

// Live join protocol — SNK7X2 code
function PairingSection() {
  const [tab, setTab] = React.useState('create'); // create | join
  const [copied, setCopied] = React.useState(false);
  const [joinCode, setJoinCode] = React.useState('SNK7X2');

  const copy = async () => {
    try { await navigator.clipboard.writeText(code); } catch(e){}
    setCopied(true);
    setTimeout(() => setCopied(false), 1600);
  };

  const attemptJoin = () => {
    if ((joinCode || '').trim().toUpperCase() === code) {
      setErr('');
      setJoined(true);
    } else {
      setErr("hmm, that code doesn't match anything yet. double-check it?");

  return (
    <section className="pairing" id="pairing" data-screen-label="04 Pairing">

            </button>
          </div>

          {tab === 'create' && (
            <div className="pair-body">
              <div className="pair-key-icon">🗝️</div>
              <div className="mono" style={{ color: 'var(--copper)', letterSpacing: '0.24em', fontSize: 11 }}>YOUR SECRET DUO CODE</div>
              <div className="pair-code">
                <span className="serif">{code}</span>
                <button className="pair-copy" onClick={copy}>{copied ? 'copied ✓' : 'Copy'}</button>
              </div>
              <p className="pair-note serif italic">"Send this code to your person. Don't spoil what's next."</p>
              <div className="pair-status mono">
                <span className="dot-pulse" /> waiting for your person to join with code {code}…

              <div className="pair-input-row">

                  placeholder="ENTER CODE"
                  value={joinCode}

                />

              </div>
              {err && <div className="pair-error mono">{err}</div>}

function App() {
  const enrollRef = useRef(null);

  // If the URL has ?invite=... treat it as arriving as the partner (skip to unlock quickly)
  useEffect(() => {
    const p = new URLSearchParams(location.search);
    if (p.get('invite')) {
      // simulate: partner opened invite
      // We'll flag the app to run through join animation on mount if state was 'enrolled'.
      // For simplicity, kick straight into 'waiting' -> 'unlocked' after a beat.
      setTimeout(() => {
        const btn = document.querySelector('[data-simulate]');
        btn && btn.click();
      }, 300);
    }
  }, []);

  const start = () => {
    enrollRef.current = 'focus';
    // scroll to duo
    const el = document.getElementById('duo');
    if (el) window.scrollTo({ top: el.offsetTop - 40, behavior: 'smooth' });
    // give the input a moment then focus
    setTimeout(() => {
      const i = document.querySelector('.enroll-input');
      i && i.focus();
    }, 700);
  };
  const learn = () => {
    const el = document.getElementById('unlock');
    if (el) window.scrollTo({ top: el.offsetTop - 20, behavior: 'smooth' });
  };
  const doSnick = () => {
    const el = document.getElementById('mini');
    if (el) window.scrollTo({ top: el.offsetTop - 20, behavior: 'smooth' });
  };

  return (
    <AppProvider>
      <TopBar onStart={start} />
      <Thread />
      <main>
        <Hero onStart={start} onLearn={learn} />
        <Ticker />
        <StorySection />
        <PairingSection />
        <DuoSection enrollRef={enrollRef} />
        <UnlockScene onDoSnick={doSnick} />
        <FourSnicks />
        <LockRuleSection />
        <DemoSection />
        <SnicksSection />
        <MorphSection />
        <BondLevels />
        <LootVault />
        <EcoSection />
        <MiniSnick />
        <CohortForm />
        <FinalCTA onStart={start} />
      </main>
      <footer>
        <span>SNICKYLINK — connect · play · grow together · <em>made for two.</em></span>
        <span>Option 3: Velvet &amp; Ember (#6B2B3C • #E8B99C) · Zero Third-Party Trackers</span>
        <span>© 2026 · v 0.1 · demo</span>
      </footer>
      <StateHUD />
    </AppProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
