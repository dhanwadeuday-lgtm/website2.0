<link rel="stylesheet" href="/src/style.css" />
<style>
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #120a0d; z-index: 300; }
  #boot .boot-logo { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 0 44px rgba(232,185,156,.35), 0 0 90px rgba(107,43,60,.4); animation: bootFloat 3.2s ease-in-out infinite; }
  #boot .seed { width: 12px; height: 12px; border-radius: 50%; background: #E8B99C; box-shadow: 0 0 24px 6px rgba(232,185,156,.45); animation: bootPulse 1.6s ease-in-out infinite; }
  @keyframes bootFloat { 0%,100% { transform: translateY(0) scale(1) } 50% { transform: translateY(-6px) scale(1.04) } }
  @keyframes bootPulse { 0%,100% { transform: scale(.7); opacity:.5 } 50% { transform: scale(1.15); opacity: 1 } }
  body.loader-gone #boot { display: none; }
</style>
</head>
<body>
  <div id="boot"><img class="boot-logo" src="/logo-web.png" alt="" /><div class="seed"></div></div>
  <canvas id="scene"></canvas>
  <div id="overlay"></div>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
